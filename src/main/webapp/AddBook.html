
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Book | BookVault</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
        }

        header {
            background: #111827;
            color: white;
            padding: 24px 7%;
        }

        .brand {
            font-size: 25px;
            font-weight: bold;
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 12px;
            margin-top: 7px;
            letter-spacing: 1.5px;
        }

        .container {
            max-width: 620px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .heading {
            margin-bottom: 24px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .muted {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-card {
            background: white;
            padding: 30px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.04);
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            display: block;
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            background: #fff;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .hint {
            margin-top: 7px;
            font-size: 12px;
            color: #64748b;
        }

        .submit-btn {
            width: 100%;
            border: none;
            border-radius: 7px;
            padding: 14px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 30px auto;
            }

            .form-card {
                padding: 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">📚 BookVault</div>
    <div class="subtitle">BOOK MANAGEMENT SYSTEM</div>
</header>

<main class="container">

    <section class="heading">
        <h1>Add a New Book</h1>
        <p class="muted">
            Enter the book details below to add it
            to your collection.
        </p>
    </section>

    <section class="form-card">

        <form action="/BookManagement/addbook" method="post">

            <div class="field">
                <label for="bookId">Book ID</label>
                <input type="number"
                       id="bookId"
                       name="bookId"
                       min="1"
                       step="1"
                       placeholder="Enter book ID"
                       required>
                <p class="hint">Enter a unique positive ID.</p>
            </div>

            <div class="field">
                <label for="bookName">Book Name</label>
                <input type="text"
                       id="bookName"
                       name="bookName"
                       maxlength="150"
                       placeholder="Enter book name"
                       required>
            </div>

            <div class="field">
                <label for="bookPrice">Book Price (₹)</label>
                <input type="number"
                       id="bookPrice"
                       name="bookPrice"
                       min="0"
                       step="0.01"
                       placeholder="Enter book price"
                       required>
            </div>

            <button class="submit-btn" type="submit">
                + Add Book
            </button>

        </form>

    </section>

    <a class="back-link" href="Index.html">
        ← Back to Dashboard
    </a>

</main>

<footer>
    BookVault · Java Servlet · JDBC · MySQL
</footer>

</body>
</html>
